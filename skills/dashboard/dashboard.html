<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDD Dashboard</title>
<script src="https://cdn.tailwindcss.com/3.4.16?plugins=typography"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  .edge { transition: stroke .15s, stroke-width .15s, opacity .15s; }
  .dim .edge:not(.hot) { opacity: .15; }
  .edge.hot { stroke-width: 2.5; }
  .node.far { box-shadow: 0 0 0 2px rgb(14 165 233 / .7); }
  @keyframes blink { 0%, 100% { border-color: rgb(245 158 11); background-color: rgb(245 158 11 / .18); box-shadow: 0 0 0 3px rgb(245 158 11 / .35); } 50% { border-color: rgb(245 158 11 / .25); background-color: transparent; box-shadow: none; } }
  .doing { animation: blink 1s ease-in-out infinite; }
  .dots { background-image: radial-gradient(rgb(161 161 170 / .12) 1px, transparent 1px); background-size: 18px 18px; }
  #drawer aside { transform: translateX(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  #drawer #backdrop { opacity: 0; transition: opacity .25s; }
  #drawer.open aside { transform: none; }
  #drawer.open #backdrop { opacity: 1; }
  #doc ul:has(> li .task) { padding-left: 0; }
  #doc li:has(.task) { list-style: none; padding-left: 0; }
  #doc li:has(.task.checked) { color: rgb(113 113 122); }
  .task { display: inline-grid; place-items: center; width: 1.05em; height: 1.05em; margin-right: .6em; vertical-align: -.15em; border-radius: .3em; border: 1.5px solid rgb(161 161 170 / .7); }
  .task.checked { background: rgb(16 185 129); border-color: rgb(16 185 129); color: white; }
  #doc pre.drawing { min-height: 7rem; color: transparent; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  #zoom svg { width: 100%; height: 100%; max-width: none !important; }
  @supports not selector(::-webkit-scrollbar) { * { scrollbar-width: thin; scrollbar-color: rgb(161 161 170 / .4) transparent; } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgb(161 161 170 / .35); border-radius: 9999px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: rgb(161 161 170 / .6); }
  ::-webkit-scrollbar-button { display: none; }
</style>
</head>
<body class="bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased">

<header class="sticky top-0 z-20 border-b border-zinc-200 dark:border-zinc-800 bg-white/90 dark:bg-zinc-950/90 backdrop-blur">
  <div class="px-4 h-14 flex items-center gap-3">
    <button id="brand" class="flex shrink-0 items-center gap-2 font-semibold tracking-tight" title="All repositories">
      <span class="grid h-7 w-7 place-items-center rounded-lg bg-gradient-to-br from-emerald-400 to-sky-500 text-xs font-bold text-white shadow-sm">S</span>SDD
    </button>
    <div id="crumbs" class="flex min-w-0 items-center gap-2 text-sm"></div>
    <nav id="views" class="hidden ml-2 inline-flex rounded-md border border-zinc-200 dark:border-zinc-800 p-0.5 text-sm">
      <button data-view="list" class="px-3 py-1 rounded">List</button>
      <button data-view="kanban" class="px-3 py-1 rounded">Kanban</button>
      <button data-view="graph" class="px-3 py-1 rounded">Graph</button>
    </nav>
    <div class="ml-auto flex items-center gap-2 text-sm">
      <span id="live" class="hidden items-center gap-1.5 text-xs text-zinc-500" title="Watching this repository for changes"><span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>Live</span>
      <button id="reload" class="hidden rounded-md border border-zinc-200 dark:border-zinc-800 px-3 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-900">Reload</button>
      <button id="open" class="rounded-md bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 px-3 py-1 hover:opacity-90">Add repo</button>
    </div>
  </div>
</header>

<div class="flex min-h-[calc(100vh-3.5rem)]">
  <nav id="side" class="hidden"></nav>
  <main id="main" class="min-w-0 flex-1 px-6 py-6"></main>
  <aside id="inspect" class="hidden"></aside>
</div>

<div id="drawer" class="hidden fixed inset-0 z-30">
  <div id="backdrop" class="absolute inset-0 bg-zinc-950/40 backdrop-blur-[2px]"></div>
  <aside class="absolute inset-y-0 right-0 flex w-full max-w-2xl flex-col overflow-hidden border-l border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 shadow-2xl sm:rounded-l-2xl">
    <div id="docAccent" class="h-1 shrink-0"></div>
    <header class="shrink-0 border-b border-zinc-200 dark:border-zinc-800 bg-gradient-to-b from-zinc-50 to-white dark:from-zinc-900/60 dark:to-zinc-950 px-6 pt-5">
      <div class="flex items-start gap-3">
        <div id="docHead" class="min-w-0 flex-1"></div>
        <div class="-mr-2 -mt-1 flex shrink-0 items-center gap-0.5">
          <span id="docNav" class="hidden items-center gap-0.5 border-r border-zinc-200 dark:border-zinc-800 pr-1 mr-1">
            <button id="prev" class="grid h-8 w-8 place-items-center rounded-md text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900 disabled:pointer-events-none disabled:opacity-30 dark:hover:bg-zinc-800 dark:hover:text-zinc-100" title="Previous ticket (←)" aria-label="Previous ticket"><svg class="h-4 w-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button>
            <button id="next" class="grid h-8 w-8 place-items-center rounded-md text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900 disabled:pointer-events-none disabled:opacity-30 dark:hover:bg-zinc-800 dark:hover:text-zinc-100" title="Next ticket (→)" aria-label="Next ticket"><svg class="h-4 w-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
          </span>
          <button id="close" class="grid h-8 w-8 place-items-center rounded-md text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900 dark:hover:bg-zinc-800 dark:hover:text-zinc-100" title="Close (Esc)" aria-label="Close"><svg class="h-4 w-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
        </div>
      </div>
      <nav id="tabs" class="mt-4 flex gap-5 text-sm"></nav>
    </header>
    <div id="docScroll" class="flex-1 overflow-y-auto">
      <article id="doc" class="prose prose-zinc dark:prose-invert max-w-none px-6 py-6 prose-headings:tracking-tight prose-h2:mt-9 prose-h2:border-b prose-h2:border-zinc-200 prose-h2:pb-2 prose-h2:text-lg dark:prose-h2:border-zinc-800 prose-a:text-emerald-600 dark:prose-a:text-emerald-400 prose-code:rounded prose-code:bg-zinc-100 prose-code:px-1 prose-code:py-0.5 prose-code:font-normal prose-code:before:content-none prose-code:after:content-none dark:prose-code:bg-zinc-800 prose-pre:rounded-xl prose-table:text-sm prose-th:text-left"></article>
    </div>
    <footer class="flex shrink-0 items-center gap-3 border-t border-zinc-200 dark:border-zinc-800 bg-zinc-50/70 dark:bg-zinc-900/40 px-6 py-2.5 text-xs text-zinc-500">
      <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 1.5h5.5L13 5v9.5H4z"/><path d="M9.5 1.5V5H13"/></svg>
      <span id="docPath" class="min-w-0 flex-1 truncate font-mono"></span>
      <button id="copyPath" class="shrink-0 rounded-md border border-zinc-200 dark:border-zinc-700 px-2 py-0.5 hover:border-zinc-400 hover:text-zinc-900 dark:hover:border-zinc-500 dark:hover:text-zinc-100">Copy path</button>
    </footer>
  </aside>
</div>

<div id="zoom" class="hidden fixed inset-0 z-40 bg-white/95 p-10 backdrop-blur dark:bg-zinc-950/95" title="Close (Esc)"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem('sdd:' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('sdd:' + k, v); } catch {} },
};

// The route lives in the hash: #/ is the repo list, #/r/<repo> a repo's homepage, #/r/<repo>/spec/<id> one spec.
const route = () => {
  const m = /^#\/r\/([^/]+)(?:\/spec\/(.+))?$/.exec(location.hash);
  return m ? { repo: m[1], spec: m[2] ? decodeURIComponent(m[2]) : null } : { repo: null, spec: null };
};
const goRepo = (id) => { location.hash = id ? '#/r/' + id : '#/'; };
const go = (id) => { location.hash = '#/r/' + state.repo.id + (id ? '/spec/' + encodeURIComponent(id) : ''); };

// The open repo's files, specs and name are copied into files, specs and root, so every single-repo view reads them as before.
const state = { repos: [], repo: null, notice: '', files: new Map(), root: '', specs: [], specId: null, view: store.get('view') || 'list', dir: store.get('dir') || 'h', cross: store.get('cross') === '1', filter: store.get('filter') || 'all', sideOpen: store.get('side') !== '0', query: '', doc: null };

// ---------- folder access ----------

function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open('sdd-dashboard', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('kv');
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const tx = open.result.transaction('kv', mode);
      const req = fn(tx.objectStore('kv'));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = () => reject(tx.error);
    };
  });
}

// Every file:// page shares one origin, so a fixed key gives each copy of this page, at any plugin version, the same repo list.
const saveRepos = async () => {
  try { await idb('readwrite', (s) => s.put(state.repos.map(({ id, name, handle }) => ({ id, name, handle })), 'repos')); } catch {}
};

async function specsDir(root) {
  try { return await (await root.getDirectoryHandle('.sdd')).getDirectoryHandle('specs'); } catch { return null; }
}

async function walk(dir, prefix, out) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'directory') await walk(h, prefix + name + '/', out);
    else if (name.endsWith('.md')) out.set(prefix + name, await (await h.getFile()).text());
  }
}

const sameFiles = (a, b) => a.size === b.size && [...a].every(([k, v]) => b.get(k) === v);

// Re-reads one repo and sets its status: 'ok', 'denied' (read permission not granted) or 'missing' (no .sdd/specs left to read).
// Returns whether its status or files changed.
async function readRepo(repo) {
  const before = repo.status;
  let files = null;
  try {
    if ((await repo.handle.queryPermission({ mode: 'read' })) !== 'granted') repo.status = 'denied';
    else {
      const specs = await specsDir(repo.handle);
      if (specs) await walk(specs, '', (files = new Map()));
      repo.status = specs ? 'ok' : 'missing';
    }
  } catch { repo.status = 'missing'; }
  if (!files || (repo.files && sameFiles(files, repo.files))) return repo.status !== before;
  repo.files = files;
  repo.specs = parse(files);
  return true;
}

function sync() {
  state.files = state.repo?.files || new Map();
  state.specs = state.repo?.specs || [];
  state.root = state.repo?.name || '';
}

// Re-reads what is on screen: the open repo, or every repo on the repo list.
async function refresh() {
  const repos = state.repo ? [state.repo] : state.repos;
  if (!(await Promise.all(repos.map(readRepo))).some(Boolean)) return;
  sync();
  render();
  if (state.doc) renderDoc(true);
}

// Re-reads the open repo every few seconds while the tab is visible; renders only when a file changed.
let polling = false;
setInterval(async () => {
  if (!state.repo || polling || document.hidden) return;
  polling = true;
  try { await refresh(); } finally { polling = false; }
}, 2000);

// A repo shows as its root folder's name; a clashing name takes the first free number suffix.
function uniqueName(name) {
  const taken = new Set(state.repos.map((r) => r.name));
  let n = 1, out = name;
  while (taken.has(out)) out = `${name} ${++n}`;
  return out;
}

async function addRepo() {
  let handle;
  try { handle = await window.showDirectoryPicker({ id: 'sdd', mode: 'read' }); } catch { return; }
  for (const r of state.repos) {
    if (await r.handle.isSameEntry(handle).catch(() => false)) return goRepo(r.id);
  }
  if (!(await specsDir(handle))) {
    state.notice = `No <code>.sdd/specs/</code> folder in <b>${esc(handle.name)}</b>. Pick the repository's root folder, the one holding <code>.sdd</code>, after running <code>/setup-repository</code> there.`;
    return state.repo ? goRepo(null) : render();
  }
  state.notice = '';
  const repo = { id: Math.random().toString(36).slice(2, 8), name: uniqueName(handle.name), handle };
  state.repos.push(repo);
  await saveRepos();
  await readRepo(repo);
  goRepo(repo.id);
}

async function removeRepo(id) {
  state.repos = state.repos.filter((r) => r.id !== id);
  await saveRepos();
  render();
}

async function reconnect(repo) {
  try { await repo.handle.requestPermission({ mode: 'read' }); } catch {}
  await readRepo(repo);
  sync();
  render();
}

async function applyRoute(read = true) {
  const { repo, spec } = route();
  state.repo = state.repos.find((r) => r.id === repo) || null;
  state.specId = spec;
  closeDoc();
  sync();
  render();
  window.scrollTo(0, 0);
  if (read) await refresh();
}

async function restore() {
  if (!window.showDirectoryPicker) {
    $('open').classList.add('hidden');
    return empty('This dashboard needs Chrome or Edge: it reads your repositories through their folder access.');
  }
  try { state.repos = (await idb('readonly', (s) => s.get('repos'))) || []; } catch {}
  await Promise.all(state.repos.map(readRepo));
  applyRoute(false);
}

// ---------- parsing ----------

const heading = (t) => (/^#\s+(.+)$/m.exec(t) || [])[1]?.trim();
const field = (t, name) => (new RegExp(`^\\*\\*${name}:\\*\\*\\s*(.+)$`, 'mi').exec(t) || [])[1]?.trim();
const numOf = (name) => (/^(\d+)-/.exec(name) || [])[1];
const unslug = (name) => name.replace(/^\d+-/, '').replace(/\.md$/, '').replace(/-/g, ' ');

// The body of a `## name` section, up to the next heading of level 1 or 2.
function section(t, name) {
  const lines = t.split(/\r?\n/);
  const i = lines.findIndex((l) => new RegExp(`^##\\s+${name}\\s*$`, 'i').test(l));
  if (i < 0) return '';
  const out = [];
  for (const l of lines.slice(i + 1)) {
    if (/^#{1,2}\s/.test(l)) break;
    out.push(l);
  }
  return out.join('\n').trim();
}

// The first paragraph of some markdown, as plain text.
const excerpt = (md) => md.replace(/^```[\s\S]*?^```/gm, '').trim().split(/\n\s*\n/)[0].replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[*_`>#]/g, '').replace(/\s+/g, ' ').trim();

function specStatus(ts) {
  if (!ts.length) return 'draft';
  if (ts.every((t) => t.status === 'done')) return 'done';
  if (ts.some((t) => t.status === 'blocked')) return 'blocked';
  if (ts.some((t) => isDoing(t.status) || t.status === 'done')) return 'active';
  return 'ready';
}

function parse(files) {
  const specs = new Map();
  const spec = (dir) => {
    if (!specs.has(dir)) specs.set(dir, { id: dir, num: numOf(dir), title: unslug(dir), key: null, path: null, summary: '', stories: 0, deps: [], landed: null, abandoned: null, review: null, milestones: new Map() });
    return specs.get(dir);
  };
  for (const [path, text] of files) {
    const p = path.split('/');
    if (!numOf(p[0])) continue;
    const s = spec(p[0]);
    if (p.length === 2 && p[1] === 'spec.md') {
      s.path = path;
      s.title = (heading(text) || s.title).replace(/^Spec:\s*/i, '');
      s.key = /^none$/i.test(field(text, 'Key') || 'none') ? null : field(text, 'Key');
      s.summary = excerpt(section(text, 'Problem Statement') || section(text, 'Solution'));
      s.stories = (section(text, 'User Stories').match(/^\s*\d+\.\s/gm) || []).length;
      s.deps = (field(text, 'Depends on') || '').split(',').map((d) => d.replace(/[`\s]/g, '')).filter(numOf);
      const landed = field(text, 'Landed') || '';
      s.landed = /^`?[0-9a-f]{7,40}/i.test(landed) ? landed.replace(/`/g, '').slice(0, 7) : null;
      s.abandoned = field(text, 'Abandoned') || null;
    } else if (p.length === 2 && p[1] === 'review.md') {
      s.review = path;
    } else if (p.length === 4 && p[1] === 'milestones' && numOf(p[2])) {
      if (!s.milestones.has(p[2])) s.milestones.set(p[2], { id: p[2], num: numOf(p[2]), title: unslug(p[2]), path: null, review: null, delivers: '', phase: null, squash: null, tickets: [] });
      const m = s.milestones.get(p[2]);
      if (p[3] === 'milestone.md') {
        m.path = path;
        m.title = (heading(text) || m.title).replace(/^Milestone\s+\d+:\s*/i, '');
        m.delivers = excerpt(field(text, 'Delivers') || '');
        const squash = field(text, 'Squash') || '';
        m.squash = /^[0-9a-f]{7,40}/i.test(squash) ? squash.slice(0, 7) : null;
        m.phase = (field(text, 'Phase') || '').replace(/`/g, '').toLowerCase();
      } else if (p[3] === 'review.md') {
        m.review = path;
      } else if (numOf(p[3])) {
        const deps = field(text, 'Depends on') || '';
        const commit = field(text, 'Commit') || '';
        m.tickets.push({
          num: numOf(p[3]),
          path,
          title: (heading(text) || unslug(p[3])).replace(/^Ticket\s+\d+:\s*/i, ''),
          status: (field(text, 'Status') || 'todo').toLowerCase().replace(/`/g, ''),
          deps: /^none/i.test(deps) ? [] : (deps.match(/\d+/g) || []).map((d) => d.padStart(3, '0')),
          commit: /^[0-9a-f]{7,40}/i.test(commit) ? commit.slice(0, 7) : null,
          milestone: m,
          spec: s,
        });
      }
    }
  }
  return [...specs.values()]
    .map((s) => {
      s.milestones = [...s.milestones.values()].sort((a, b) => a.num.localeCompare(b.num));
      s.milestones.forEach((m) => m.tickets.sort((a, b) => a.num.localeCompare(b.num)));
      s.tickets = s.milestones.flatMap((m) => m.tickets);
      s.status = specStatus(s.tickets);
      if (s.milestones.some((m) => milestoneStatus(m) === 'attention')) s.status = 'attention';
      else if (s.status === 'done' && s.milestones.some(isClosing)) s.status = 'active';
      return s;
    })
    .sort((a, b) => a.num.localeCompare(b.num))
    .map((s, _, all) => {
      // A dependency is a spec folder name; one that is missing or has no Landed line holds this spec's build back.
      s.deps = s.deps.map((id) => ({ id, spec: all.find((x) => x.id === id) }));
      s.waiting = s.deps.filter((d) => !d.spec?.landed);
      if (s.waiting.length && (s.status === 'draft' || s.status === 'ready')) s.status = 'waiting';
      // An Abandoned line retires the spec, whatever its tickets say.
      if (s.abandoned) s.status = 'abandoned';
      return s;
    });
}

// ---------- rendering ----------

// Every status the page shows, at every level: a repo, a spec and a milestone each take one of these keys, and a ticket's Status maps onto one.
// attention is the build waiting on the user's answers; blocked, on a ticket the user must unblock.
const STATUS = {
  attention: { label: 'Needs attention', tone: 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300', accent: 'from-red-500 to-rose-600' },
  blocked: { label: 'Blocked', tone: 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300', accent: 'from-red-400 to-rose-500' },
  active: { label: 'In progress', tone: 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300', accent: 'from-amber-400 to-orange-500' },
  waiting: { label: 'Waiting', tone: 'bg-violet-100 text-violet-800 dark:bg-violet-950 dark:text-violet-300', accent: 'from-violet-400 to-purple-500' },
  ready: { label: 'Ready to build', tone: 'bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300', accent: 'from-sky-400 to-indigo-500' },
  draft: { label: 'Needs tickets', tone: 'bg-zinc-100 text-zinc-700 dark:bg-zinc-800 dark:text-zinc-300', accent: 'from-zinc-300 to-zinc-400 dark:from-zinc-700 dark:to-zinc-600' },
  done: { label: 'Done', tone: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300', accent: 'from-emerald-400 to-teal-500' },
  abandoned: { label: 'Abandoned', tone: 'bg-zinc-100 text-zinc-500 dark:bg-zinc-800 dark:text-zinc-400', accent: 'from-zinc-200 to-zinc-300 dark:from-zinc-800 dark:to-zinc-700' },
};
const TICKET_STATUS = { todo: 'draft', doing: 'active', blocked: 'blocked', done: 'done' };

const isDoing = (s) => s === 'doing';
const statusTone = (s) => STATUS[TICKET_STATUS[s] || 'draft'].tone;
const pill = (s) => `<span class="shrink-0 inline-flex items-center gap-1.5 rounded-full px-2 py-0.5 text-xs font-medium ${statusTone(s)}">${isDoing(s) ? '<span class="h-1.5 w-1.5 rounded-full bg-amber-500 animate-pulse"></span>' : ''}${esc(s)}</span>`;
const cardTone = (s) =>
  s === 'done' ? 'border-emerald-300 dark:border-emerald-900'
  : isDoing(s) ? 'doing border-amber-500'
  : s === 'blocked' ? 'border-red-400 dark:border-red-700'
  : 'border-zinc-200 dark:border-zinc-800';
const num = (n) => `<span class="font-mono text-xs text-zinc-400">#${esc(n)}</span>`;

function empty(msg) {
  $('side').className = 'hidden';
  $('inspect').className = 'hidden';
  $('crumbs').innerHTML = '';
  $('views').classList.add('hidden');
  $('main').innerHTML = `
    <div class="mx-auto max-w-md py-24 text-center space-y-4">
      <h1 class="text-xl font-semibold tracking-tight">Spec dashboard</h1>
      <p class="text-sm text-zinc-500">Specs, milestones and tickets from the repositories you add. Nothing leaves your machine.</p>
      ${msg ? `<div class="text-sm">${msg}</div>` : ''}
    </div>`;
}

const slash = '<span class="text-zinc-300 dark:text-zinc-700">/</span>';
function crumbs(spec) {
  $('crumbs').innerHTML = `${slash}<button data-home class="truncate max-w-[12rem] font-medium text-zinc-600 hover:text-zinc-900 dark:text-zinc-300 dark:hover:text-zinc-100">${esc(state.root)}</button>`
    + (spec ? `${slash}<span class="font-mono text-xs text-zinc-400">${esc(spec.num)}</span><span class="hidden sm:inline truncate max-w-xs text-zinc-600 dark:text-zinc-300">${esc(spec.title)}</span>` : '');
  $('crumbs').querySelector('[data-home]').onclick = () => go(null);
}

function render() {
  const live = state.repo?.status === 'ok';
  $('reload').classList.toggle('hidden', !state.repos.length);
  $('live').classList.toggle('hidden', !live);
  $('live').classList.toggle('inline-flex', live);
  if (!state.repo) return repoList();
  if (!live) {
    empty(`<p class="text-zinc-500">${GONE[state.repo.status].text}</p>`
      + (state.repo.status === 'denied' ? '<button id="reconnect" class="mt-4 rounded-md border border-zinc-300 dark:border-zinc-700 px-3 py-1.5 hover:bg-zinc-100 dark:hover:bg-zinc-900">Reconnect</button>' : ''));
    if ($('reconnect')) $('reconnect').onclick = () => reconnect(state.repo);
    return crumbs(null);
  }
  if (!state.specs.length) {
    empty('No specs yet. Run <code>/to-spec</code> to write one.');
    return crumbs(null);
  }
  const spec = state.specs.find((s) => s.id === state.specId);
  crumbs(spec);
  $('views').classList.toggle('hidden', !spec);
  panels(spec);
  if (!spec) return home();

  document.querySelectorAll('#views button').forEach((b) => {
    b.className = 'px-3 py-1 rounded ' + (b.dataset.view === state.view ? 'bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900' : 'hover:bg-zinc-100 dark:hover:bg-zinc-900');
  });

  const body = !spec.tickets.length
    ? `<div class="rounded-xl border border-dashed border-zinc-300 dark:border-zinc-700 py-16 text-center text-sm text-zinc-500">No tickets yet. Run <code class="font-mono">/to-tickets</code> on this spec.</div>`
    : state.view === 'kanban' ? kanban(spec) : state.view === 'graph' ? graph(spec) : list(spec);

  const scroll = $('main').querySelector('[data-scroll]')?.scrollLeft;
  $('main').innerHTML = body;
  const scroller = $('main').querySelector('[data-scroll]');
  if (scroller && scroll) scroller.scrollLeft = scroll;
  wireTicketRefs($('main'));
  $('main').querySelectorAll('[data-ticket]').forEach((el) => (el.onclick = () => openTicket(spec, el.dataset.ticket)));
  $('main').querySelectorAll('[data-milestone]').forEach((el) => {
    const m = spec.milestones.find((m) => m.id === el.dataset.milestone);
    el.onclick = () => openMilestone(spec, m);
  });
  if (state.view === 'graph') wireGraph();
  // Opening a spec's graph, or turning it, brings the first unfinished milestone into view. A refresh keeps the place.
  const at = state.view === 'graph' && spec.id + '|' + state.dir;
  if (at && at !== state.scrolledTo) scrollToCurrent();
  state.scrolledTo = at;
}

// Scrolls the graph to the first unfinished milestone, the one work is on.
function scrollToCurrent() {
  const spec = state.view === 'graph' && state.specs.find((s) => s.id === state.specId);
  const m = spec && spec.milestones.find((m) => milestoneStatus(m) !== 'done');
  if (m) $('main').querySelector(`#graph [data-milestone="${CSS.escape(m.id)}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'start', inline: 'start' });
}

// ---------- homepage ----------

const doneOf = (ts) => ts.filter((t) => t.status === 'done').length;
const pctOf = (ts) => (ts.length ? Math.round((doneOf(ts) / ts.length) * 100) : 0);

function ring(pct, size, stroke, label = '') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<span class="relative inline-grid shrink-0 place-items-center" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" class="absolute inset-0 -rotate-90">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" class="stroke-zinc-200 dark:stroke-zinc-800"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round" class="stroke-emerald-500"
        stroke-dasharray="${c}" stroke-dashoffset="${pct ? c * (1 - pct / 100) : c}" style="transition:stroke-dashoffset .6s"/>
    </svg>${label}</span>`;
}

// A milestone's bar: done tickets fill it green, tickets in progress amber.
const fill = (m, h) => {
  const n = m.tickets.length || 1;
  const busy = m.tickets.filter((t) => isDoing(t.status)).length;
  return `<div class="flex ${h} overflow-hidden rounded-full bg-zinc-200 dark:bg-zinc-800">
    <div class="h-full bg-emerald-500" style="width:${(doneOf(m.tickets) / n) * 100}%"></div><div class="h-full bg-amber-500 animate-pulse" style="width:${(busy / n) * 100}%"></div></div>`;
};

// One segment per milestone, as wide as its ticket count.
const segments = (s) => `<div class="flex gap-1">${s.milestones.map((m) =>
  `<div title="M${esc(m.num)} · ${esc(m.title)} — ${doneOf(m.tickets)}/${m.tickets.length}" style="flex:${Math.max(1, m.tickets.length)} 1 0">${fill(m, 'h-1.5')}</div>`).join('')}</div>`;

// One icon per ticket status: a check when done, a pulsing ring while in progress, a bang when blocked, a dashed ring before.
const statusIcon = (s, size = 'h-5 w-5') =>
  s === 'done' ? `<span class="grid ${size} shrink-0 place-items-center rounded-full bg-emerald-500 text-white"><svg class="h-3 w-3" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.2 2.2 4.8-5.2"/></svg></span>`
  : isDoing(s) ? `<span class="grid ${size} shrink-0 place-items-center rounded-full border-2 border-amber-500"><span class="h-1.5 w-1.5 rounded-full bg-amber-500 animate-pulse"></span></span>`
  : s === 'blocked' ? `<span class="grid ${size} shrink-0 place-items-center rounded-full bg-red-500 text-[11px] font-bold text-white">!</span>`
  : `<span class="${size} shrink-0 rounded-full border-2 border-dashed border-zinc-300 dark:border-zinc-600"></span>`;

// /build's closing steps after the last ticket, from milestone.md's Phase line; a Squash commit ends them.
// failed is a check /build gave up fixing: it waits on the user; the others run on their own.
const PHASE_LABEL = { check: 'Checking', failed: 'Check failed', review: 'In review', decide: 'Deciding escalations', fix: 'Fixing review', squash: 'Squashing' };
const waitsOnUser = (m) => m.phase === 'failed';
const isClosing = (m) => !m.squash && PHASE_LABEL[m.phase] && m.tickets.length && m.tickets.every((t) => t.status === 'done');
const milestoneStatus = (m) => (isClosing(m) ? (waitsOnUser(m) ? 'attention' : 'active') : specStatus(m.tickets));
const milestoneLabel = (m) => (isClosing(m) ? PHASE_LABEL[m.phase] : STATUS[milestoneStatus(m)].label);
const milestonePill = (m) => `<span class="shrink-0 rounded-full px-2 py-0.5 text-xs font-medium ${STATUS[milestoneStatus(m)].tone}">${esc(milestoneLabel(m))}</span>`;
// A closing milestone's step, with its spec's number when shown outside the spec.
const closingRow = (m, s) => `
  <p class="flex min-w-0 items-center gap-2 px-2 py-1 text-xs">
    ${milestonePill(m)}<span class="font-mono text-zinc-400">${s ? `${esc(s.num)} · ` : ''}M${esc(m.num)}</span><span class="min-w-0 truncate text-zinc-500">${esc(m.title)}</span>
  </p>`;
const closingOf = (specs) => specs.flatMap((s) => s.milestones.filter(isClosing).map((m) => ({ s, m })));
// The specs still meant to be built: an abandoned spec's tickets never count towards progress or work in flight.
const liveSpecs = (specs) => specs.filter((s) => !s.abandoned);
const plural = (n, w, ws = w + 's') => `${n} ${n === 1 ? w : ws}`;

const ticketChip = (t, extra = '') => `
  <button data-ticket-ref="${esc(t.spec.id)}|${esc(t.num)}" class="flex w-full min-w-0 items-center gap-2 rounded-md px-2 py-1 text-left text-sm hover:bg-zinc-100 dark:hover:bg-zinc-800/70">
    <span class="h-1.5 w-1.5 shrink-0 rounded-full ${t.status === 'blocked' ? 'bg-red-500' : 'bg-amber-500 animate-pulse'}"></span>
    <span class="font-mono text-xs text-zinc-400">#${esc(t.num)}</span><span class="min-w-0 flex-1 truncate">${esc(t.title)}</span>${extra}
  </button>`;

function home() {
  if (!$('home')) {
    $('main').innerHTML = `<div id="home">
      <section id="hero"></section>
      <div class="mt-10 mb-4 flex flex-wrap items-center gap-3">
        <h2 class="text-lg font-semibold tracking-tight">Specs</h2>
        <div id="filters" class="flex flex-wrap gap-1.5"></div>
        <label class="relative ml-auto w-full sm:w-64">
          <svg class="pointer-events-none absolute left-2.5 top-1/2 h-4 w-4 -translate-y-1/2 text-zinc-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 3.4 9.83l3.13 3.14a.75.75 0 1 0 1.06-1.06l-3.13-3.14A5.5 5.5 0 0 0 9 3.5ZM5 9a4 4 0 1 1 8 0 4 4 0 0 1-8 0Z" clip-rule="evenodd"/></svg>
          <input id="search" type="search" placeholder="Search specs…" class="w-full rounded-lg border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 py-1.5 pl-8 pr-8 text-sm outline-none focus:border-zinc-400 dark:focus:border-zinc-600">
          <kbd class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 rounded border border-zinc-200 dark:border-zinc-700 px-1 font-mono text-[10px] text-zinc-400">/</kbd>
        </label>
      </div>
      <div id="grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4"></div>
    </div>`;
    $('search').value = state.query;
    $('search').oninput = (e) => { state.query = e.target.value; homeGrid(); };
  }
  homeHero();
  homeGrid();
}

function homeHero() {
  const specs = liveSpecs(state.specs);
  const all = specs.flatMap((s) => s.tickets);
  const ms = specs.flatMap((s) => s.milestones);
  const doing = all.filter((t) => isDoing(t.status));
  const blocked = all.filter((t) => t.status === 'blocked');
  const closing = closingOf(specs);
  const pct = pctOf(all);
  const headline = blocked.length || closing.some(({ m }) => waitsOnUser(m)) ? 'Waiting on you'
    : doing.length ? `${doing.length} ticket${doing.length === 1 ? '' : 's'} in flight`
    : closing.length ? milestoneLabel(closing[0].m)
    : all.length && pct === 100 ? 'Everything shipped'
    : all.length ? 'Ready to build' : 'Specs await tickets';
  const tile = (label, value, sub, tone = '') => `
    <div class="rounded-xl border border-zinc-200/80 dark:border-zinc-800 bg-white/70 dark:bg-zinc-900/60 px-4 py-3 backdrop-blur">
      <dt class="text-xs text-zinc-500">${label}</dt>
      <dd class="mt-1 text-2xl font-semibold tabular-nums tracking-tight ${tone}">${value}</dd>
      <dd class="text-xs text-zinc-400">${sub}</dd>
    </div>`;
  const attention = [...doing, ...blocked];

  $('hero').innerHTML = `
    <div class="relative overflow-hidden rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-gradient-to-br from-white to-zinc-50 dark:from-zinc-900 dark:to-zinc-950 p-6 sm:p-8">
      <div class="pointer-events-none absolute -right-20 -top-28 h-72 w-72 rounded-full bg-emerald-400/20 blur-3xl"></div>
      <div class="pointer-events-none absolute -bottom-32 left-1/4 h-72 w-72 rounded-full bg-sky-400/15 blur-3xl"></div>
      <div class="relative flex flex-wrap items-center gap-8">
        <div class="flex items-center gap-5">
          ${ring(pct, 104, 9, `<span class="text-center leading-tight"><span class="block text-2xl font-semibold tabular-nums">${pct}%</span><span class="text-[10px] uppercase tracking-widest text-zinc-500">done</span></span>`)}
          <div>
            ${state.root ? `<p class="font-mono text-xs uppercase tracking-widest text-zinc-500">${esc(state.root)}</p>` : ''}
            <h1 class="mt-1 text-3xl font-semibold tracking-tight">${headline}</h1>
            <p class="mt-1 text-sm text-zinc-500">${doneOf(all)} of ${all.length} tickets done across ${specs.length} spec${specs.length === 1 ? '' : 's'}.</p>
          </div>
        </div>
        <dl class="grid w-full grid-cols-2 gap-3 sm:grid-cols-4 lg:ml-auto lg:w-auto">
          ${tile('Specs', specs.length, `${specs.filter((s) => s.status === 'done').length} done`)}
          ${tile('Milestones', ms.length, `${ms.filter((m) => m.tickets.length && m.tickets.every((t) => t.status === 'done')).length} done`)}
          ${tile('Doing', doing.length, 'tickets', doing.length ? 'text-amber-600 dark:text-amber-400' : '')}
          ${tile('Blocked', blocked.length, 'tickets', blocked.length ? 'text-red-600 dark:text-red-400' : '')}
        </dl>
      </div>
      ${attention.length || closing.length ? `
        <div class="relative mt-6 border-t border-zinc-200 dark:border-zinc-800 pt-4">
          <p class="mb-2 text-xs font-medium uppercase tracking-widest text-zinc-500">Now building</p>
          <div class="grid gap-1 sm:grid-cols-2">${closing.map(({ s, m }) => closingRow(m, s)).join('')}${attention.map((t) => ticketChip(t, `<span class="hidden md:inline truncate max-w-[40%] text-xs text-zinc-400">${esc(t.spec.title)}</span>`)).join('')}</div>
        </div>` : ''}
    </div>`;
  wireTicketRefs($('hero'));
}

function homeGrid() {
  const counts = {};
  state.specs.forEach((s) => (counts[s.status] = (counts[s.status] || 0) + 1));
  const filter = state.filter === 'all' || counts[state.filter] ? state.filter : 'all';
  const chip = (key, label, n) => `<button data-filter="${key}" class="rounded-full border px-3 py-1 text-xs font-medium transition ${filter === key
    ? 'border-zinc-900 bg-zinc-900 text-white dark:border-zinc-100 dark:bg-zinc-100 dark:text-zinc-900'
    : 'border-zinc-200 text-zinc-600 hover:border-zinc-400 dark:border-zinc-800 dark:text-zinc-400 dark:hover:border-zinc-600'}">${label} <span class="ml-0.5 opacity-60">${n}</span></button>`;
  $('filters').innerHTML = chip('all', 'All', state.specs.length)
    + Object.entries(STATUS).filter(([k]) => counts[k]).map(([k, v]) => chip(k, v.label, counts[k])).join('');
  $('filters').querySelectorAll('[data-filter]').forEach((b) => (b.onclick = () => { state.filter = b.dataset.filter; store.set('filter', state.filter); homeGrid(); }));

  const q = state.query.trim().toLowerCase();
  const specs = state.specs
    .filter((s) => filter === 'all' || s.status === filter)
    .filter((s) => !q || [s.num, s.title, s.key, s.summary].some((f) => f?.toLowerCase().includes(q)))
    .reverse();
  $('grid').innerHTML = specs.length ? specs.map(card).join('')
    : `<div class="col-span-full rounded-xl border border-dashed border-zinc-300 dark:border-zinc-700 py-16 text-center text-sm text-zinc-500">No specs match.</div>`;
  $('grid').querySelectorAll('[data-spec]').forEach((el) => {
    el.onclick = () => go(el.dataset.spec);
    el.onkeydown = (e) => e.key === 'Enter' && e.target === el && go(el.dataset.spec);
  });
  wireTicketRefs($('grid'));
}

function card(s) {
  const st = STATUS[s.status];
  const live = s.tickets.filter((t) => isDoing(t.status) || t.status === 'blocked');
  const closing = s.milestones.filter(isClosing);
  const next = s.milestones.find((m) => m.tickets.some((t) => t.status !== 'done'));
  const foot = s.abandoned ? `<p class="truncate text-xs text-zinc-500">Abandoned · ${esc(s.abandoned)}</p>`
    : live.length || closing.length ? `<div class="space-y-0.5">${closing.map((m) => closingRow(m)).join('')}${live.slice(0, 3).map((t) => ticketChip(t)).join('')}${live.length > 3 ? `<p class="px-2 text-xs text-zinc-400">+${live.length - 3} more</p>` : ''}</div>`
    : s.status === 'waiting' ? `<p class="truncate text-xs text-violet-600 dark:text-violet-400">Waiting on ${s.waiting.map((d) => `<span class="font-mono">${esc(numOf(d.id))}</span>`).join(', ')}</p>`
    : s.status === 'draft' ? `<p class="text-xs text-zinc-500">Run <code class="font-mono">/to-tickets</code> to plan the build.</p>`
    : s.status === 'done' ? `<p class="text-xs text-emerald-600 dark:text-emerald-400">✓ All ${plural(s.milestones.length, 'milestone')} complete</p>`
    : next ? `<p class="truncate text-xs text-zinc-500">Next up · <span class="font-mono text-zinc-400">M${esc(next.num)}</span> ${esc(next.title)}</p>` : '';

  return `
    <article data-spec="${esc(s.id)}" tabindex="0" class="group relative flex cursor-pointer flex-col overflow-hidden rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/40 p-5 outline-none transition hover:-translate-y-0.5 hover:border-zinc-300 hover:shadow-lg hover:shadow-zinc-900/5 focus-visible:ring-2 focus-visible:ring-emerald-500 dark:hover:border-zinc-700 dark:hover:shadow-black/40">
      <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r ${st.accent}"></div>
      <div class="flex items-center gap-2 text-xs">
        <span class="font-mono text-zinc-400">${esc(s.num)}</span>
        ${s.key ? `<span class="rounded bg-zinc-100 dark:bg-zinc-800 px-1.5 py-0.5 font-mono text-zinc-600 dark:text-zinc-300">${esc(s.key)}</span>` : ''}
        <span class="ml-auto rounded-full px-2 py-0.5 font-medium ${st.tone}">${st.label}</span>
      </div>
      <h3 class="mt-3 text-lg font-semibold leading-snug tracking-tight line-clamp-2 transition group-hover:text-emerald-700 dark:group-hover:text-emerald-400">${esc(s.title)}</h3>
      ${s.summary ? `<p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400 line-clamp-3">${esc(s.summary)}</p>` : ''}
      <div class="mt-auto pt-5">
        ${s.milestones.length ? segments(s) : ''}
        <div class="mt-4 flex items-center gap-3">
          ${ring(pctOf(s.tickets), 40, 4, `<span class="text-[10px] font-semibold tabular-nums">${pctOf(s.tickets)}%</span>`)}
          <div class="text-xs leading-tight">
            <div class="font-medium text-zinc-700 dark:text-zinc-200">${doneOf(s.tickets)}/${plural(s.tickets.length, 'ticket')}</div>
            <div class="text-zinc-500">${plural(s.milestones.length, 'milestone')}${s.stories ? ` · ${plural(s.stories, 'story', 'stories')}` : ''}</div>
          </div>
        </div>
        ${foot ? `<div class="mt-4 border-t border-zinc-100 dark:border-zinc-800 pt-3">${foot}</div>` : ''}
      </div>
    </article>`;
}

// Ticket shortcuts open the drawer in place, without leaving the homepage.
function wireTicketRefs(root) {
  root.querySelectorAll('[data-ticket-ref]').forEach((el) => (el.onclick = (e) => {
    e.stopPropagation();
    const [id, n] = el.dataset.ticketRef.split('|');
    openTicket(state.specs.find((s) => s.id === id), n);
  }));
}

const depChips = (t) => t.deps.length
  ? `<span class="inline-flex items-center gap-1 text-xs text-zinc-400" title="Depends on">←${t.deps.map((d) => `<span class="rounded bg-zinc-100 dark:bg-zinc-800 px-1 font-mono text-zinc-500">${esc(d)}</span>`).join('')}</span>` : '';
const commitChip = (t) => t.commit
  ? `<span class="inline-flex items-center gap-1 rounded border border-zinc-200 dark:border-zinc-800 px-1.5 font-mono text-xs text-zinc-500" title="Commit">
      <svg class="h-3 w-3" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M1 8h4.5M10.5 8H15"/></svg>${esc(t.commit)}</span>` : '';
const milestoneChip = (m) => `<span class="truncate rounded bg-zinc-100 dark:bg-zinc-800 px-1.5 py-0.5 text-[11px] text-zinc-500 dark:text-zinc-400">M${esc(m.num)} · ${esc(m.title)}</span>`;

function list(spec) {
  return `<div class="space-y-5">${spec.milestones.map((m) => `
    <section class="overflow-hidden rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/40">
      <button data-milestone="${esc(m.id)}" class="group flex w-full items-center gap-4 px-5 py-4 text-left hover:bg-zinc-50 dark:hover:bg-zinc-900/60">
        ${ring(pctOf(m.tickets), 40, 4, `<span class="text-[10px] font-semibold tabular-nums">${pctOf(m.tickets)}%</span>`)}
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-2">
            <span class="font-mono text-xs text-zinc-400">M${esc(m.num)}</span>
            <span class="font-semibold tracking-tight group-hover:underline">${esc(m.title)}</span>
            ${milestonePill(m)}
          </div>
          ${m.delivers ? `<p class="mt-0.5 truncate text-sm text-zinc-500">${esc(m.delivers)}</p>` : ''}
        </div>
        ${m.squash ? `<span class="hidden sm:inline rounded-md border border-zinc-200 dark:border-zinc-700 px-2 py-0.5 font-mono text-xs text-zinc-500">${esc(m.squash)}</span>` : ''}
        <span class="text-xs tabular-nums text-zinc-500">${doneOf(m.tickets)}/${m.tickets.length}</span>
      </button>
      <ul class="divide-y divide-zinc-100 dark:divide-zinc-800/70 border-t border-zinc-100 dark:border-zinc-800">
        ${m.tickets.map((t) => `
          <li data-ticket="${esc(t.num)}" class="flex cursor-pointer items-center gap-3 px-5 py-2.5 hover:bg-zinc-50 dark:hover:bg-zinc-900/60 ${isDoing(t.status) ? 'doing border-l-4 border-l-amber-500' : t.status === 'blocked' ? 'border-l-4 border-l-red-500 bg-red-50/50 dark:bg-red-950/20' : ''}">
            ${statusIcon(t.status)}
            ${num(t.num)}
            <span class="min-w-0 flex-1 truncate text-sm ${t.status === 'done' ? 'text-zinc-500' : ''}">${esc(t.title)}</span>
            <span class="hidden sm:inline-flex">${depChips(t)}</span>
            <span class="hidden md:inline-flex">${commitChip(t)}</span>
            ${pill(t.status)}
          </li>`).join('')}
        ${m.tickets.length ? '' : '<li class="px-5 py-3 text-sm text-zinc-500">No tickets in this milestone.</li>'}
      </ul>
    </section>`).join('')}</div>`;
}

const columnAccent = (c) => (c === 'done' ? 'bg-emerald-500' : isDoing(c) ? 'bg-amber-500' : c === 'blocked' ? 'bg-red-500' : 'bg-zinc-300 dark:bg-zinc-700');

// One column per ticket status, always shown, so the board keeps its shape as work moves.
const COLUMNS = [
  { key: 'todo', label: 'Todo', empty: 'Nothing queued' },
  { key: 'doing', label: 'Doing', empty: 'Nothing being built' },
  { key: 'blocked', label: 'Blocked', empty: 'Nothing blocked' },
  { key: 'done', label: 'Done', empty: 'Nothing done yet' },
];

function kanban(spec) {
  return `<div data-scroll class="grid gap-4 pb-2" style="grid-template-columns:repeat(${COLUMNS.length},minmax(240px,1fr));overflow-x:auto">
    ${COLUMNS.map((c) => {
      const ts = spec.tickets.filter((t) => t.status === c.key);
      return `<div class="flex flex-col overflow-hidden rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50/80 dark:bg-zinc-900/40">
        <div class="h-1 ${columnAccent(c.key)}"></div>
        <div class="flex items-center gap-2 px-3 pb-2 pt-3 text-sm font-medium">
          ${statusIcon(c.key, 'h-4 w-4')}<span>${esc(c.label)}</span>
          <span class="ml-auto rounded-full bg-zinc-200/70 dark:bg-zinc-800 px-2 text-xs tabular-nums text-zinc-500">${ts.length}</span>
        </div>
        <div class="flex-1 space-y-2 p-3 pt-1">${ts.map((t) => `
          <div data-ticket="${esc(t.num)}" class="cursor-pointer rounded-lg border ${cardTone(t.status)} bg-white dark:bg-zinc-950 p-3 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md dark:shadow-black/30">
            <div class="flex min-w-0 items-center gap-2">${num(t.num)}<span class="ml-auto min-w-0 max-w-[75%] truncate">${milestoneChip(t.milestone)}</span></div>
            <div class="mt-1.5 text-sm font-medium leading-snug">${esc(t.title)}</div>
            ${t.deps.length || t.commit ? `<div class="mt-2.5 flex items-center gap-2">${depChips(t)}<span class="ml-auto">${commitChip(t)}</span></div>` : ''}
          </div>`).join('') || `<div class="rounded-lg border border-dashed border-zinc-300 dark:border-zinc-700 py-6 text-center text-xs text-zinc-400">${c.empty}</div>`}</div>
      </div>`;
    }).join('')}
  </div>`;
}

const G = { colW: 220, gapX: 70, cardH: 58, gapY: 16, top: 44, gapV: 56, gutter: 170, laneW: 14 };

// Splits each ticket's dependencies into the ones inside its milestone and the ones from earlier milestones. A
// dependency another one already implies is dropped (transitive reduction). The graph draws the outer ones only on
// request, since the milestone order already shows them and their lines cross every band in between; otherwise
// the card lists them as chips.
function depsOf(spec) {
  const byNum = new Map(spec.tickets.map((t) => [t.num, t]));
  const memo = new Map();
  const ancestors = (n, seen = new Set()) => {
    if (memo.has(n)) return memo.get(n);
    seen.add(n);
    const out = new Set();
    for (const d of byNum.get(n)?.deps ?? []) {
      if (!byNum.has(d) || seen.has(d)) continue;
      out.add(d);
      ancestors(d, seen).forEach((a) => out.add(a));
    }
    memo.set(n, out);
    return out;
  };
  return new Map(spec.tickets.map((t) => {
    const deps = t.deps.filter((d) => byNum.has(d) && !t.deps.some((e) => e !== d && ancestors(e).has(d)));
    const inner = deps.filter((d) => byNum.get(d).milestone === t.milestone);
    return [t.num, { inner, outer: deps.filter((d) => !inner.includes(d)) }];
  }));
}

// Layers each milestone's tickets by dependency depth, so every edge runs forward (rightward or downward).
function layout(spec, deps, cardSize) {
  const byNum = new Map(spec.tickets.map((t) => [t.num, t]));
  const col = new Map();
  const spans = [];
  let start = 0;
  for (const m of spec.milestones) {
    const depth = (t, seen = new Set()) => {
      if (col.has(t.num)) return col.get(t.num);
      seen.add(t.num);
      let c = start;
      for (const d of t.deps) {
        const dt = byNum.get(d);
        if (dt?.milestone === m && !seen.has(d)) c = Math.max(c, depth(dt, seen) + 1);
      }
      col.set(t.num, c);
      return c;
    };
    m.tickets.forEach((t) => depth(t));
    const end = Math.max(start, ...m.tickets.map((t) => col.get(t.num))) + 1;
    spans.push({ m, start, end });
    start = end;
  }

  // An edge that skips layers runs through a lane: a narrow track it holds in each layer it crosses,
  // so it never passes under a card. Edges from the same ticket share one lane and branch off it.
  const reach = new Map();
  for (const t of spec.tickets) for (const d of deps.get(t.num)) {
    if (col.has(d) && col.get(d) < col.get(t.num) - 1) reach.set(d, Math.max(reach.get(d) ?? 0, col.get(t.num) - 1));
  }
  const lane = (d, l) => `~${d}@${l}`;
  const nodes = spec.tickets.map((t) => ({
    id: t.num,
    layer: col.get(t.num),
    preds: deps.get(t.num).filter((d) => col.has(d) && col.get(d) < col.get(t.num)).map((d) => (col.get(d) < col.get(t.num) - 1 ? lane(d, col.get(t.num) - 1) : d)),
  }));
  for (const [d, last] of reach) for (let l = col.get(d) + 1; l <= last; l++) {
    nodes.push({ id: lane(d, l), layer: l, preds: [l === col.get(d) + 1 ? d : lane(d, l - 1)] });
    col.set(lane(d, l), l);
  }

  const columns = Array.from({ length: start }, () => []);
  nodes.forEach((n) => columns[n.layer].push(n));
  // Places each layer's nodes along the slot axis, in pixels: a node aims for the middle of its predecessors and is
  // pushed on only as far as the node before it needs. A lane keeps its predecessor's line until something pushes
  // it, so it runs straight; it takes G.laneW, not a card's width.
  const isLane = (id) => id.startsWith('~');
  const size = (id) => (isLane(id) ? 0 : cardSize);
  const slot = new Map();
  const mid = (id) => slot.get(id) + size(id) / 2;
  let extent = 0;
  columns.forEach((ns) => {
    const aim = (n) => {
      const ms = n.preds.filter((p) => slot.has(p)).map(mid);
      return ms.length ? ms.reduce((a, b) => a + b, 0) / ms.length : Infinity;
    };
    let cursor = 0;
    // On a tie a card goes first, so a lane steps around it rather than pushing it off its predecessors.
    ns.sort((a, b) => aim(a) - aim(b) || isLane(a.id) - isLane(b.id) || a.id.localeCompare(b.id)).forEach((n) => {
      const pad = isLane(n.id) ? G.laneW / 2 : 0;
      const want = aim(n) === Infinity ? 0 : aim(n) - size(n.id) / 2;
      const s = Math.max(want, cursor + pad);
      slot.set(n.id, s);
      cursor = s + size(n.id) + (isLane(n.id) ? pad : G.gapY);
    });
    extent = Math.max(extent, cursor);
  });

  // The lane slots an edge from d to t passes through, in order.
  const route = (d, t) => {
    const out = [];
    for (let l = col.get(d) + 1; l < col.get(t); l++) out.push(lane(d, l));
    return out;
  };
  return { col, slot, spans, route, layers: start, extent: Math.max(extent - G.gapY, cardSize) };
}

// Maps layers and slot offsets to pixels: layers run along x when horizontal, along y when vertical.
function geometry(dir) {
  return dir === 'v'
    ? { layer: (l) => l * (G.cardH + G.gapV), at: (l, s) => ({ x: G.gutter + s, y: l * (G.cardH + G.gapV) }) }
    : { layer: (l) => l * (G.colW + G.gapX), at: (l, s) => ({ x: l * (G.colW + G.gapX), y: G.top + s }) };
}

function graph(spec) {
  const v = state.dir === 'v';
  const deps = depsOf(spec);
  const drawn = new Map([...deps].map(([n, { inner, outer }]) => [n, state.cross ? [...inner, ...outer] : inner]));
  const { col, slot, spans, route, layers, extent } = layout(spec, drawn, v ? G.colW : G.cardH);
  const g = geometry(state.dir);
  const pos = new Map(spec.tickets.map((t) => [t.num, { ...g.at(col.get(t.num), slot.get(t.num)), t }]));
  const W = v ? G.gutter + extent + 20 : layers * (G.colW + G.gapX) - G.gapX + 20;
  const H = v ? layers * (G.cardH + G.gapV) - G.gapV + 20 : G.top + extent + 20;
  const gap = v ? G.gapV : G.gapX;

  const edges = [];
  for (const [n, to] of pos) for (const d of drawn.get(n)) {
    const from = pos.get(d);
    if (!from) continue;
    // Entry and exit points of a card or lane, and a curve between them along the layer axis. A lane is a line,
    // so its slot offset is already its middle.
    const box = (id) => g.at(col.get(id), slot.get(id));
    const enter = ({ x, y }, line) => (v ? [x + (line ? 0 : G.colW / 2), y] : [x, y + (line ? 0 : G.cardH / 2)]);
    const exit = ({ x, y }, line) => (v ? [x + (line ? 0 : G.colW / 2), y + G.cardH] : [x + G.colW, y + (line ? 0 : G.cardH / 2)]);
    const curve = ([x1, y1], [x2, y2]) => {
      const mid = Math.max(v ? 24 : 30, Math.abs(v ? y2 - y1 : x2 - x1) / 2);
      return v ? ` C${x1},${y1 + mid} ${x2},${y2 - mid} ${x2},${y2}` : ` C${x1 + mid},${y1} ${x2 - mid},${y2} ${x2},${y2}`;
    };
    let at = exit(from);
    let path = `M${at[0]},${at[1]}`;
    if (col.get(d) < col.get(n)) for (const id of route(d, n)) {
      path += curve(at, enter(box(id), true));
      at = exit(box(id), true);
      path += ` L${at[0]},${at[1]}`;
    }
    const [ex, ey] = enter(to);
    path += curve(at, [ex, ey]);
    const tone = from.t.status === 'done' ? 'stroke-zinc-300 dark:stroke-zinc-700' : 'stroke-zinc-500 dark:stroke-zinc-400';
    edges.push(`<path class="edge ${tone}" data-from="${esc(d)}" data-to="${esc(n)}" d="${path}" fill="none" stroke-width="1.5"/>`);
  }

  const dirBtn = (d, label) => `<button data-dir="${d}" class="px-2 py-0.5 rounded ${state.dir === d ? 'bg-zinc-200 dark:bg-zinc-800' : 'text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100'}">${label}</button>`;
  const legend = COLUMNS.map((c) => `<span class="inline-flex items-center gap-1.5">${statusIcon(c.key, 'h-3.5 w-3.5')}${esc(c.label)}</span>`).join('');
  // Each milestone gets a bordered band, so it reads which tickets belong together. Its leading edge carries the
  // milestone's status colour and a glow echoes the hero's; parity alternates the tint.
  // Bands are HTML, so across the layers they stretch to the panel's full width, past the graph's own.
  const bands = spans.map(({ m, start, end }, i) => {
    const a = g.layer(start) - gap / 2 + 6, b = g.layer(end) - gap / 2 - 6;
    const box = v ? `left:-16px;right:-16px;top:${a}px;height:${b - a}px` : `top:-16px;bottom:-16px;left:${a}px;width:${b - a}px`;
    const even = i % 2;
    const tone = even
      ? `bg-gradient-to-${v ? 'r' : 'b'} from-sky-500/[.06] via-transparent to-emerald-500/[.06] border-sky-500/20 dark:border-sky-400/15`
      : `bg-gradient-to-${v ? 'l' : 't'} from-emerald-500/[.05] via-zinc-500/[.03] to-zinc-500/[.05] border-emerald-500/15 dark:border-emerald-400/10`;
    const edge = v ? 'inset-y-0 left-0 w-[3px] bg-gradient-to-b' : 'inset-x-0 top-0 h-[3px] bg-gradient-to-r';
    const glow = even ? '-bottom-24 -left-16 bg-sky-400/10' : '-top-24 -right-16 bg-emerald-400/10';
    return `<div class="absolute overflow-hidden rounded-xl border ${tone}" style="${box}">
      <div class="absolute ${edge} ${STATUS[milestoneStatus(m)].accent} opacity-80"></div>
      <div class="pointer-events-none absolute h-56 w-56 rounded-full blur-3xl ${glow}"></div>
    </div>`;
  }).join('');
  // overflow-clip, not overflow-hidden, so the toolbar can stick below the page header while the graph scrolls.
  return `<div class="overflow-clip rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/30">
  <div class="sticky top-14 z-10 flex flex-wrap items-center gap-x-4 gap-y-2 border-b border-zinc-200 dark:border-zinc-800 bg-white/90 dark:bg-zinc-950/90 backdrop-blur px-4 py-2.5 text-xs text-zinc-500">
    ${legend}
    <span class="hidden lg:inline text-zinc-400">· Hover a ticket to trace its dependencies</span>
    <button data-cross class="ml-auto rounded-md border border-zinc-200 dark:border-zinc-800 px-2 py-1 ${state.cross ? 'bg-zinc-200 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100' : 'hover:text-zinc-900 dark:hover:text-zinc-100'}" aria-pressed="${state.cross}" title="Draw dependencies between milestones">Cross-milestone</button>
    <div class="inline-flex rounded-md border border-zinc-200 dark:border-zinc-800 p-0.5">${dirBtn('h', 'Horizontal')}${dirBtn('v', 'Vertical')}</div>
  </div>
  <div data-scroll class="dots overflow-x-auto p-8"><div id="graph" class="relative" style="width:${W}px;min-width:100%;height:${H}px">
    ${bands}
    <svg class="absolute left-0 top-0 overflow-visible" width="${W}" height="${H}">
      ${edges.join('')}
    </svg>
    ${spans.map(({ m, start, end }) => {
      const a = g.layer(start), len = g.layer(end) - gap - a;
      const box = v ? `left:0;top:${a}px;width:${G.gutter - 24}px;height:${len}px` : `left:${a}px;top:0;width:${len}px`;
      return `
      <button data-milestone="${esc(m.id)}" class="group absolute scroll-m-16 scroll-mt-32 flex ${v ? 'items-center' : 'items-start justify-center'}" style="${box}">
        <span class="flex max-w-full ${v ? 'flex-col items-start gap-1 rounded-lg px-3 py-2' : 'items-center gap-2 rounded-full px-3 py-1'} border border-zinc-200 dark:border-zinc-700 bg-white/90 dark:bg-zinc-900/90 text-left text-sm shadow-sm group-hover:border-zinc-400 dark:group-hover:border-zinc-500">
          <span class="flex shrink-0 items-center gap-1.5">${ring(pctOf(m.tickets), 14, 2.5)}<span class="font-mono text-xs text-zinc-400">M${esc(m.num)}</span></span>
          <span class="${v ? 'line-clamp-2' : 'truncate'} font-medium">${esc(m.title)}</span>
        </span>
      </button>`;
    }).join('')}
    ${[...pos.values()].map(({ x, y, t }) => {
      const { outer } = deps.get(t.num);
      // Dependencies from earlier milestones, when not drawn: two chips fit beside the number, the rest fold into a count.
      const chips = outer.length && !state.cross
        ? `<span class="inline-flex min-w-0 items-center gap-1 text-xs text-zinc-400" title="Depends on, from earlier milestones: ${esc(outer.join(', '))}">↑${outer.slice(0, 2).map((d) => `<span class="rounded bg-zinc-100 dark:bg-zinc-800 px-1 font-mono text-zinc-500">${esc(d)}</span>`).join('')}${outer.length > 2 ? `<span>+${outer.length - 2}</span>` : ''}</span>` : '';
      return `
      <div data-ticket="${esc(t.num)}" data-outer="${esc(outer.join(' '))}" class="node absolute cursor-pointer rounded-lg border bg-white dark:bg-zinc-950 px-3 py-2 shadow-sm hover:border-zinc-500 hover:shadow-md ${cardTone(t.status)}"
        style="left:${x}px;top:${y}px;width:${G.colW}px;height:${G.cardH}px">
        <div class="flex items-center gap-1.5">${statusIcon(t.status, 'h-3.5 w-3.5')}${num(t.num)}${chips}<span class="ml-auto shrink-0">${t.commit ? commitChip(t) : pill(t.status)}</span></div>
        <div class="mt-1 truncate text-sm font-medium">${esc(t.title)}</div>
      </div>`;
    }).join('')}
  </div></div></div>`;
}

function wireGraph() {
  $('main').querySelectorAll('[data-dir]').forEach((b) => (b.onclick = () => { state.dir = b.dataset.dir; store.set('dir', state.dir); render(); }));
  $('main').querySelector('[data-cross]').onclick = () => { state.cross = !state.cross; store.set('cross', state.cross ? '1' : '0'); render(); };
  const g = $('graph');
  g.querySelectorAll('.node').forEach((node) => {
    const n = node.dataset.ticket;
    // Dependencies across milestones have no line, so hovering lights up the cards at their other end instead.
    const far = [...node.dataset.outer.split(' ').filter(Boolean).map((d) => g.querySelector(`.node[data-ticket="${d}"]`)),
      ...g.querySelectorAll(`.node[data-outer~="${n}"]`)].filter(Boolean);
    node.onmouseenter = () => {
      g.classList.add('dim');
      g.querySelectorAll(`.edge[data-from="${n}"], .edge[data-to="${n}"]`).forEach((e) => e.classList.add('hot'));
      far.forEach((f) => f.classList.add('far'));
    };
    node.onmouseleave = () => {
      g.classList.remove('dim');
      g.querySelectorAll('.edge.hot').forEach((e) => e.classList.remove('hot'));
      far.forEach((f) => f.classList.remove('far'));
    };
  });
}

// ---------- repo list ----------

// A repo takes its most urgent spec's status: the user's turn (a spec awaiting answers or blocked), then work running, then a spec ready to build.
// Repos sort in that order, then the rest; by name within each.
const REPO_ORDER = ['attention', 'active', 'ready'];
const repoStatus = (r) => {
  if (r.status !== 'ok') return null;
  const has = (...ks) => r.specs.some((s) => ks.includes(s.status));
  return has('attention', 'blocked') ? 'attention' : has('active') ? 'active' : has('ready') ? 'ready' : null;
};
const repoTier = (r) => { const i = REPO_ORDER.indexOf(repoStatus(r)); return i < 0 ? REPO_ORDER.length : i; };
const GONE = {
  denied: { label: 'Needs permission', text: 'The browser needs your permission to read this folder again.' },
  missing: { label: 'Missing', text: 'Its <code>.sdd/specs/</code> folder is gone: moved, renamed or deleted.' },
};

function repoCard(r) {
  const remove = `<button data-remove="${r.id}" title="Remove from the dashboard" class="-mr-1 shrink-0 rounded-md px-1.5 text-zinc-400 hover:bg-zinc-100 hover:text-zinc-900 dark:hover:bg-zinc-800 dark:hover:text-zinc-100">✕</button>`;
  if (r.status !== 'ok') {
    const g = GONE[r.status];
    return `
    <article class="flex flex-col rounded-xl border border-dashed border-zinc-300 dark:border-zinc-700 p-5">
      <div class="flex items-center gap-2">
        <h2 class="min-w-0 flex-1 truncate text-lg font-semibold tracking-tight text-zinc-500">${esc(r.name)}</h2>
        <span class="shrink-0 rounded-full px-2 py-0.5 text-xs font-medium ${statusTone(r.status === 'denied' ? 'blocked' : 'todo')}">${g.label}</span>${remove}
      </div>
      <p class="mt-2 text-sm text-zinc-500">${g.text}</p>
      ${r.status === 'denied' ? `<button data-reconnect="${r.id}" class="mt-4 self-start rounded-md border border-zinc-300 dark:border-zinc-700 px-3 py-1.5 text-sm hover:bg-zinc-100 dark:hover:bg-zinc-900">Reconnect</button>` : ''}
    </article>`;
  }
  const ts = liveSpecs(r.specs).flatMap((s) => s.tickets);
  const st = repoStatus(r);
  const closing = closingOf(liveSpecs(r.specs));
  return `
    <article data-repo="${r.id}" tabindex="0" class="group relative flex cursor-pointer flex-col overflow-hidden rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/40 p-5 outline-none transition hover:-translate-y-0.5 hover:border-zinc-300 hover:shadow-lg hover:shadow-zinc-900/5 focus-visible:ring-2 focus-visible:ring-emerald-500 dark:hover:border-zinc-700 dark:hover:shadow-black/40">
      <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r ${STATUS[st || 'draft'].accent}"></div>
      <div class="flex items-center gap-2">
        <h2 class="min-w-0 flex-1 truncate text-lg font-semibold tracking-tight transition group-hover:text-emerald-700 dark:group-hover:text-emerald-400">${esc(r.name)}</h2>
        ${st ? `<span class="shrink-0 rounded-full px-2 py-0.5 text-xs font-medium ${STATUS[st].tone}">${STATUS[st].label}</span>` : ''}${remove}
      </div>
      <div class="mt-4 flex items-center gap-3">
        ${ring(pctOf(ts), 40, 4, `<span class="text-[10px] font-semibold tabular-nums">${pctOf(ts)}%</span>`)}
        <div class="text-xs leading-tight">
          <div class="font-medium text-zinc-700 dark:text-zinc-200">${doneOf(ts)}/${plural(ts.length, 'ticket')}</div>
          <div class="text-zinc-500">${plural(r.specs.length, 'spec')}</div>
        </div>
      </div>
      ${closing.length ? `<div class="-mx-2 mt-4 space-y-0.5 border-t border-zinc-100 dark:border-zinc-800 pt-3">${closing.map(({ s, m }) => closingRow(m, s)).join('')}</div>` : ''}
    </article>`;
}

function repoList() {
  $('side').className = 'hidden';
  $('inspect').className = 'hidden';
  $('crumbs').innerHTML = '';
  $('views').classList.add('hidden');
  const repos = [...state.repos].sort((a, b) => repoTier(a) - repoTier(b) || a.name.localeCompare(b.name));
  $('main').innerHTML = `
    <div class="mx-auto max-w-6xl">
      <p class="font-mono text-xs uppercase tracking-widest text-zinc-500">Spec dashboard</p>
      <h1 class="mt-1 mb-6 text-3xl font-semibold tracking-tight">Repositories</h1>
      ${state.notice ? `
        <div class="mb-6 flex items-start gap-3 rounded-xl border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-200">
          <p class="flex-1">${state.notice}</p><button data-dismiss title="Dismiss" class="shrink-0 hover:opacity-70">✕</button>
        </div>` : ''}
      ${repos.length ? `<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">${repos.map(repoCard).join('')}</div>`
        : `<div class="rounded-xl border border-dashed border-zinc-300 dark:border-zinc-700 py-16 text-center text-sm text-zinc-500">No repositories yet. Click <b>Add repo</b> and pick a repository's root folder. Nothing leaves your machine.</div>`}
    </div>`;
  const dismiss = $('main').querySelector('[data-dismiss]');
  if (dismiss) dismiss.onclick = () => { state.notice = ''; render(); };
  $('main').querySelectorAll('[data-repo]').forEach((el) => {
    el.onclick = () => goRepo(el.dataset.repo);
    el.onkeydown = (e) => e.key === 'Enter' && e.target === el && goRepo(el.dataset.repo);
  });
  $('main').querySelectorAll('[data-remove]').forEach((el) => (el.onclick = (e) => { e.stopPropagation(); removeRepo(el.dataset.remove); }));
  $('main').querySelectorAll('[data-reconnect]').forEach((el) => (el.onclick = () => reconnect(state.repos.find((r) => r.id === el.dataset.reconnect))));
}

// ---------- side panels ----------

// The spec list on the left and, with a spec open, its details on the right; both stay put while the centre scrolls.
const PANEL = 'sticky top-14 h-[calc(100vh-3.5rem)] shrink-0 overflow-y-auto border-zinc-200 dark:border-zinc-800';

function panels(spec) {
  $('side').className = `${PANEL} ${state.sideOpen ? 'w-[272px]' : 'w-14'} border-r bg-zinc-50/70 dark:bg-zinc-900/30`;
  $('side').innerHTML = specList(spec);
  wirePanel($('side'), spec);
  if (!spec) {
    $('inspect').className = 'hidden';
    $('inspect').innerHTML = '';
    return;
  }
  $('inspect').className = `${PANEL} w-[340px] border-l bg-white dark:bg-zinc-950`;
  $('inspect').innerHTML = specPanel(spec);
  wirePanel($('inspect'), spec);
}

// Collapses the spec list to a rail of spec numbers, or expands it back; the choice survives reloads.
function toggleSide() {
  state.sideOpen = !state.sideOpen;
  store.set('side', state.sideOpen ? '1' : '0');
  panels(state.specs.find((s) => s.id === state.specId));
}

function wirePanel(root, spec) {
  root.querySelectorAll('[data-side-toggle]').forEach((el) => (el.onclick = toggleSide));
  root.querySelectorAll('[data-home]').forEach((el) => (el.onclick = () => go(null)));
  root.querySelectorAll('[data-go]').forEach((el) => (el.onclick = () => go(el.dataset.go)));
  wireTicketRefs(root);
  if (!spec) return;
  root.querySelectorAll('[data-open-spec]').forEach((el) => (el.onclick = () => openDoc([specRef(spec), reviewRef(spec)])));
  root.querySelectorAll('[data-milestone]').forEach((el) => {
    const m = spec.milestones.find((m) => m.id === el.dataset.milestone);
    el.onclick = () => openMilestone(spec, m);
  });
}

const OVERVIEW_ICON = '<svg class="h-4 w-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>';
const sideToggle = () => `<button data-side-toggle title="${state.sideOpen ? 'Collapse' : 'Expand'} the sidebar ( [ )" class="grid h-8 w-8 shrink-0 place-items-center rounded-md text-zinc-400 hover:bg-zinc-100 hover:text-zinc-900 dark:hover:bg-zinc-900 dark:hover:text-zinc-100">
    <svg class="h-4 w-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M6 2.5v11"/><path d="${state.sideOpen ? 'M11 6.5L9.5 8l1.5 1.5' : 'M9.5 6.5L11 8l-1.5 1.5'}"/></svg>
  </button>`;

function specList(spec) {
  if (!state.sideOpen) return specRail(spec);
  return `<div class="p-3">
    <div class="flex items-center gap-1">
      <button data-home class="flex min-w-0 flex-1 items-center gap-2 rounded-md px-2.5 py-1.5 text-sm ${!spec ? 'bg-white font-medium shadow-sm ring-1 ring-zinc-200 dark:bg-zinc-900 dark:ring-zinc-800' : 'text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900 dark:hover:bg-zinc-900 dark:hover:text-zinc-100'}">
        ${OVERVIEW_ICON}Overview
      </button>
      ${sideToggle()}
    </div>
    <p class="px-2.5 pb-1.5 pt-5 text-[11px] font-medium uppercase tracking-widest text-zinc-400">Specs · ${state.specs.length}</p>
    ${[...state.specs].reverse().map((s) => {
      const sel = s === spec, st = STATUS[s.status];
      return `<button data-go="${esc(s.id)}" class="mb-1 block w-full rounded-lg px-2.5 py-2 text-left ${sel ? 'bg-white shadow-sm ring-1 ring-zinc-200 dark:bg-zinc-900 dark:ring-zinc-800' : 'hover:bg-zinc-100 dark:hover:bg-zinc-900/70'}">
        <div class="flex items-center gap-2 text-sm">
          <span class="h-2 w-2 shrink-0 rounded-full bg-gradient-to-r ${st.accent}" title="${st.label}"></span>
          <span class="font-mono text-xs text-zinc-400">${esc(s.num)}</span>
          <span class="min-w-0 flex-1 truncate ${sel ? 'font-semibold' : 'font-medium text-zinc-700 dark:text-zinc-300'}">${esc(s.title)}</span>
          <span class="text-xs tabular-nums text-zinc-500">${pctOf(s.tickets)}%</span>
        </div>
        ${s.milestones.length ? `<div class="mt-2 pl-4">${segments(s)}</div>` : ''}
      </button>`;
    }).join('')}
  </div>`;
}

// The collapsed spec list: each spec as its number and status dot, its title in the tooltip.
function specRail(spec) {
  const on = 'bg-white shadow-sm ring-1 ring-zinc-200 dark:bg-zinc-900 dark:ring-zinc-800';
  const off = 'text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900 dark:hover:bg-zinc-900 dark:hover:text-zinc-100';
  return `<div class="flex flex-col items-center gap-1 px-2 py-3">
    ${sideToggle()}
    <button data-home title="Overview" class="grid h-9 w-9 place-items-center rounded-md ${!spec ? on : off}">${OVERVIEW_ICON}</button>
    <div class="my-2 h-px w-6 bg-zinc-200 dark:bg-zinc-800"></div>
    ${[...state.specs].reverse().map((s) => {
      const st = STATUS[s.status];
      return `<button data-go="${esc(s.id)}" title="${esc(s.num)} · ${esc(s.title)} · ${st.label} · ${pctOf(s.tickets)}%" class="relative grid h-9 w-9 shrink-0 place-items-center rounded-md font-mono text-xs ${s === spec ? `${on} font-semibold` : off}">
        ${esc(s.num)}<span class="absolute right-1 top-1 h-1.5 w-1.5 rounded-full bg-gradient-to-r ${st.accent}"></span>
      </button>`;
    }).join('')}
  </div>`;
}

// The first todo ticket whose dependencies are all done: what /build picks up next.
const nextTicket = (spec) => spec.tickets.find((t) => t.status === 'todo'
  && t.deps.every((d) => (spec.tickets.find((x) => x.num === d)?.status ?? 'done') === 'done'));

function specPanel(spec) {
  const st = STATUS[spec.status], ts = spec.tickets, pct = pctOf(ts);
  const doing = ts.filter((t) => isDoing(t.status));
  const blocked = ts.filter((t) => t.status === 'blocked');
  const msDone = spec.milestones.filter((m) => milestoneStatus(m) === 'done').length;
  const live = [...doing, ...blocked];
  const closing = spec.milestones.filter(isClosing);
  const next = nextTicket(spec);
  const caps = (t) => `<p class="mb-2 text-[11px] font-medium uppercase tracking-widest text-zinc-400">${t}</p>`;
  const of = (n, total) => `${n}<span class="text-xs font-normal text-zinc-400">/${total}</span>`;
  const stat = (label, value, tone = '') => `<div class="rounded-lg border border-zinc-200 dark:border-zinc-800 px-3 py-2"><dt class="text-[11px] text-zinc-500">${label}</dt><dd class="text-lg font-semibold tabular-nums tracking-tight ${tone}">${value}</dd></div>`;
  return `<div class="h-1 bg-gradient-to-r ${st.accent}"></div>
  <div class="space-y-7 p-5">
    <div>
      <div class="flex flex-wrap items-center gap-2 text-xs">
        <span class="font-mono uppercase tracking-widest text-zinc-500">Spec ${esc(spec.num)}</span>
        ${spec.key ? `<span class="rounded bg-zinc-100 dark:bg-zinc-800 px-1.5 py-0.5 font-mono text-zinc-600 dark:text-zinc-300">${esc(spec.key)}</span>` : ''}
        <span class="rounded-full px-2 py-0.5 font-medium ${st.tone}">${st.label}</span>
      </div>
      <button data-open-spec class="mt-2 text-left text-xl font-semibold leading-snug tracking-tight decoration-zinc-300 underline-offset-4 hover:underline dark:decoration-zinc-600" title="Read the spec">${esc(spec.title)}</button>
      ${spec.summary ? `<p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400 line-clamp-4">${esc(spec.summary)}</p>` : ''}
    </div>
    <div class="flex items-center gap-4">
      ${ring(pct, 76, 7, `<span class="text-center leading-tight"><span class="block text-base font-semibold tabular-nums">${pct}%</span><span class="text-[8px] uppercase tracking-widest text-zinc-500">done</span></span>`)}
      <dl class="grid flex-1 grid-cols-2 gap-2">
        ${stat('Tickets', of(doneOf(ts), ts.length))}
        ${stat('Milestones', of(msDone, spec.milestones.length))}
        ${stat('Doing', doing.length, doing.length ? 'text-amber-600 dark:text-amber-400' : '')}
        ${stat('Blocked', blocked.length, blocked.length ? 'text-red-600 dark:text-red-400' : '')}
      </dl>
    </div>
    ${spec.deps.length ? `<div>${caps('Depends on')}<div class="-mx-2 space-y-0.5">${spec.deps.map((d) => `
      <button ${d.spec ? `data-go="${esc(d.id)}"` : 'disabled'} class="flex w-full min-w-0 items-center gap-2 rounded-md px-2 py-1.5 text-left text-sm enabled:hover:bg-zinc-100 dark:enabled:hover:bg-zinc-900">
        <span class="font-mono text-xs text-zinc-400">${esc(numOf(d.id))}</span>
        <span class="min-w-0 flex-1 truncate">${esc(d.spec ? d.spec.title : unslug(d.id))}</span>
        ${d.spec?.landed ? `<span class="text-xs text-emerald-600 dark:text-emerald-400" title="Landed as ${esc(d.spec.landed)}">Landed</span>`
          : `<span class="text-xs text-violet-600 dark:text-violet-400">${d.spec?.abandoned ? 'Abandoned' : d.spec ? 'Not landed' : 'Missing'}</span>`}
      </button>`).join('')}</div></div>` : ''}
    ${live.length || closing.length ? `<div>${caps('Now building')}<div class="-mx-2 space-y-0.5">${closing.map((m) => closingRow(m)).join('')}${live.map((t) => ticketChip(t)).join('')}</div></div>` : ''}
    ${next && !live.length && !closing.length ? `<div>${caps('Up next')}
      <button data-ticket-ref="${esc(spec.id)}|${esc(next.num)}" class="flex w-full items-start gap-2.5 rounded-lg border border-dashed border-zinc-300 dark:border-zinc-700 px-3 py-2.5 text-left hover:border-zinc-400 dark:hover:border-zinc-500">
        ${statusIcon(next.status, 'h-4 w-4 mt-0.5')}
        <span class="min-w-0"><span class="block text-sm font-medium leading-snug">${esc(next.title)}</span><span class="text-xs text-zinc-500"><span class="font-mono">#${esc(next.num)}</span> · M${esc(next.milestone.num)} ${esc(next.milestone.title)}</span></span>
      </button></div>` : ''}
    ${spec.milestones.length ? `<div>${caps('Milestones')}<div class="-mx-2 space-y-0.5">${spec.milestones.map((m) => `
      <button data-milestone="${esc(m.id)}" class="group block w-full rounded-md px-2 py-1.5 text-left hover:bg-zinc-100 dark:hover:bg-zinc-900">
        <div class="flex items-center gap-2 text-xs">
          <span class="font-mono text-zinc-400">M${esc(m.num)}</span>
          <span class="min-w-0 flex-1 truncate text-zinc-700 group-hover:underline dark:text-zinc-200">${esc(m.title)}</span>
          ${isClosing(m) ? milestonePill(m) : `<span class="tabular-nums text-zinc-500">${doneOf(m.tickets)}/${m.tickets.length}</span>`}
        </div>
        <div class="mt-1.5">${fill(m, 'h-1')}</div>
      </button>`).join('')}</div></div>` : ''}
    <button data-open-spec class="w-full rounded-md border border-zinc-200 dark:border-zinc-800 py-1.5 text-sm hover:bg-zinc-50 dark:hover:bg-zinc-900">Read the spec</button>
  </div>`;
}

// ---------- drawer ----------

// A drawer tab names a spec, one of its milestones or one of its tickets, so it still resolves after a re-parse.
const specRef = (spec) => ({ kind: 'spec', spec: spec.id });
const milestoneRef = (spec, m) => ({ kind: 'milestone', spec: spec.id, id: m.id });
const ticketRef = (spec, n) => ({ kind: 'ticket', spec: spec.id, id: n });
// A review belongs to a milestone, or to the spec when it reviewed the whole spec.
const reviewRef = (spec, m) => ({ kind: 'review', spec: spec.id, id: m?.id });
// A milestone deciding its escalations opens on its review.
const openMilestone = (spec, m) => openDoc([milestoneRef(spec, m), reviewRef(spec, m), specRef(spec)], m.phase === 'decide' && m.review ? 1 : 0);

function resolve(ref) {
  const spec = state.specs.find((s) => s.id === ref.spec);
  if (!spec) return null;
  const badge = (tone, label) => `<span class="rounded-full px-2 py-0.5 text-xs font-medium ${tone}">${label}</span>`;
  const count = (ts) => `<span class="inline-flex items-center gap-1.5 text-xs text-zinc-500">${ring(pctOf(ts), 14, 2.5)}${doneOf(ts)}/${plural(ts.length, 'ticket')} done</span>`;
  const sep = '<span class="text-zinc-300 dark:text-zinc-700">·</span>';
  if (ref.kind === 'spec') {
    const st = STATUS[spec.status];
    return {
      label: 'Spec', path: spec.path, accent: 'bg-gradient-to-r ' + st.accent, title: spec.title,
      kicker: `<span class="font-mono">Spec ${esc(spec.num)}</span>`,
      badges: badge(st.tone, st.label) + (spec.key ? `<span class="rounded bg-zinc-100 dark:bg-zinc-800 px-1.5 py-0.5 font-mono text-xs text-zinc-600 dark:text-zinc-300">${esc(spec.key)}</span>` : '') + count(spec.tickets),
    };
  }
  if (ref.kind === 'milestone') {
    const m = spec.milestones.find((m) => m.id === ref.id);
    if (!m) return null;
    const st = milestoneStatus(m);
    return {
      label: 'Milestone', path: m.path, accent: 'bg-gradient-to-r ' + STATUS[st].accent, title: m.title,
      kicker: `<span class="font-mono">Milestone M${esc(m.num)}</span>${sep}<span class="truncate">${esc(spec.title)}</span>`,
      badges: milestonePill(m) + count(m.tickets) + (m.squash ? `<span class="rounded-md border border-zinc-200 dark:border-zinc-700 px-1.5 font-mono text-xs text-zinc-500">${esc(m.squash)}</span>` : ''),
    };
  }
  if (ref.kind === 'review') {
    const m = ref.id && spec.milestones.find((m) => m.id === ref.id);
    if (ref.id && !m) return null;
    return {
      label: 'Review', path: m ? m.review : spec.review, accent: 'bg-gradient-to-r ' + STATUS[m ? milestoneStatus(m) : spec.status].accent,
      title: `Review of ${m ? m.title : spec.title}`,
      kicker: m ? `<span class="font-mono">Milestone M${esc(m.num)}</span>${sep}<span class="truncate">${esc(spec.title)}</span>` : `<span class="font-mono">Spec ${esc(spec.num)}</span>`,
      badges: m ? milestonePill(m) : '',
    };
  }
  const t = spec.tickets.find((t) => t.num === ref.id);
  if (!t) return null;
  return {
    label: `Ticket #${t.num}`, path: t.path, accent: columnAccent(t.status), title: t.title,
    kicker: `${statusIcon(t.status, 'h-3.5 w-3.5')}<span class="font-mono">Ticket #${esc(t.num)}</span>${sep}<span class="truncate">M${esc(t.milestone.num)} · ${esc(t.milestone.title)}</span>`,
    badges: pill(t.status) + depChips(t) + commitChip(t),
  };
}

// Splits a file into the fields the drawer shows as a details box (front matter and the leading
// `**Field:** value` lines) and the markdown body below them. The title is dropped: the header shows it.
const HEADER_FIELDS = /^(status|milestone|key|feature|title)$/i;
function splitDoc(text) {
  let body = text.replace(/^﻿/, '');
  const meta = [];
  const fm = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(body);
  if (fm) {
    body = body.slice(fm[0].length);
    for (const l of fm[1].split(/\r?\n/)) {
      const m = /^([\w-]+):\s*(.*)$/.exec(l);
      if (m) meta.push([m[1], m[2].replace(/^(["'])(.*)\1$/, '$2') || '—']);
    }
  }
  const lines = body.replace(/^\s*#\s+.+(\r?\n|$)/, '').split(/\r?\n/);
  let i = 0;
  for (; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const m = /^\*\*([^*]+?):\*\*\s*(.*)$/.exec(lines[i]);
    if (!m) break;
